# Sirve la app web de DePaso (una sola pagina): cualquier ruta que no sea un archivo
# devuelve index.html y la app resuelve la pantalla en el navegador.
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión de lo que viaja: el JavaScript baja a la cuarta parte y la app abre más rápido.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css text/plain text/javascript application/javascript application/json image/svg+xml application/manifest+json;

  # Los archivos con hash en el nombre no cambian nunca: se guardan un año.
  location /_expo/ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Imágenes e íconos: un mes.
  location ~* \.(png|jpg|jpeg|webp|ico|svg|woff2?)$ {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
  }

  # index.html nunca se cachea: así una versión nueva se ve enseguida.
  location = /index.html {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    include /etc/nginx/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}

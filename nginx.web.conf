# Sirve la app web de DePaso (una sola pagina): cualquier ruta que no sea un archivo
# devuelve index.html y la app resuelve la pantalla en el navegador.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Los archivos con hash en el nombre se pueden guardar para siempre.
  location /_expo/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca se cachea: asi una version nueva se ve enseguida.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
}

# Encabezados de seguridad de la web. Se incluyen en cada "location" porque nginx descarta los
# encabezados del servidor cuando un "location" define los suyos.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# la ubicación y el micrófono (dictado) los usa la propia app; nada más
add_header Permissions-Policy "geolocation=(self), microphone=(self), camera=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# No se restringe de dónde salen los scripts (el mapa necesita código en línea y Mapbox), pero
# sí se prohíbe incrustar la web en otra, usar plugins y mandar formularios a otro sitio.
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8" />
<script src="assets/gsap.min.js"></script>
<style>
  @font-face { font-family: Fredoka; src: url(assets/Fredoka.ttf); font-weight: 300 700; }
  @font-face { font-family: Montserrat; src: url(assets/Montserrat.ttf); font-weight: 400; }
  @font-face { font-family: Montserrat; src: url(assets/Montserrat-Bold.ttf); font-weight: 700; }
  html, body { margin: 0; width: 1080px; height: 1920px; background: #000; overflow: hidden; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; }
  .clip { position: absolute; inset: 0; }
  .layer { position: absolute; inset: 0; }

  /* cámara: todo lo que se mueve junto */
  #camara { position: absolute; inset: 0; transform-origin: 540px 1290px; }

  /* cielo nocturno con la luz naranja de la ciudad en el horizonte */
  #cielo { background: linear-gradient(180deg, #02040a 0%, #06101f 38%, #10213a 58%, #3a2a1c 70%, #0b0d12 78%); }

  /* edificios (se generan abajo, siempre iguales) */
  #lejos { filter: blur(3px); opacity: .75; }
  #cerca { filter: blur(1.2px); }
  .edificio { position: absolute; bottom: 0; background: #05070c; }
  .ventana { position: absolute; width: 10px; height: 14px; border-radius: 1px; }

  /* calle mojada en perspectiva */
  #calle { position: absolute; left: -400px; right: -400px; top: 1160px; height: 900px;
    background: linear-gradient(180deg, #0e1117 0%, #07080b 100%);
    transform: perspective(700px) rotateX(58deg); transform-origin: 50% 0; }
  .reflejo { position: absolute; top: 0; width: 46px; height: 900px; filter: blur(14px); opacity: .55; }
  .linea { position: absolute; left: 50%; width: 14px; height: 120px; margin-left: -7px; background: #c9b37a; opacity: .5; }

  /* luces desenfocadas (autos, semáforos, faroles) */
  .bokeh { position: absolute; border-radius: 50%; mix-blend-mode: screen; }

  /* lluvia */
  .gota { position: absolute; width: 2px; background: linear-gradient(180deg, rgba(200,220,255,0), rgba(200,220,255,.55)); transform: rotate(12deg); }

  /* celular en mano */
  #celu { position: absolute; left: 290px; top: 1080px; width: 500px; height: 1010px; border-radius: 70px;
    background: #0c0d10; box-shadow: 0 0 0 6px #1d2028, 0 60px 120px rgba(0,0,0,.8), 0 0 160px rgba(124,176,255,.18);
    transform: rotate(-6deg); }
  #pantalla { position: absolute; inset: 18px; border-radius: 54px; overflow: hidden;
    background: linear-gradient(180deg, #121722 0%, #0a0d14 100%); }
  #pantalla .hora { font-family: Montserrat, sans-serif; font-weight: 700; color: #fff; font-size: 34px; text-align: center; margin-top: 40px; }
  .noti { position: absolute; left: 26px; right: 26px; border-radius: 30px; padding: 24px 28px;
    background: rgba(255,255,255,.1); backdrop-filter: blur(12px); font-family: Montserrat, sans-serif; color: #fff; }
  .noti b { display: block; font-size: 32px; margin-bottom: 6px; }
  .noti span { font-size: 30px; color: #c7cbd6; }
  .noti .caro { color: #ff7b72; font-weight: 700; }
  #blanco { position: absolute; inset: 0; background: #fff; opacity: 0; }

  /* textos de la escena */
  .texto { position: absolute; left: 90px; right: 90px; font-family: Fredoka, sans-serif; font-weight: 600; color: #fff;
    text-shadow: 0 6px 40px rgba(0,0,0,.7); opacity: 0; }
  #t1 { top: 240px; font-size: 150px; letter-spacing: -2px; }
  #t2 { top: 420px; font-size: 76px; }
  #t3 { top: 520px; font-size: 64px; color: #dfe6f2; }
  #t4 { top: 300px; font-size: 104px; line-height: 1.05; }

  /* acabado de cine: viñeta y grano */
  #vineta { background: radial-gradient(ellipse at 50% 55%, transparent 45%, rgba(0,0,0,.75) 100%); pointer-events: none; }
  #grano { opacity: .13; mix-blend-mode: overlay; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  #flash { background: #fff; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="realista" data-start="0" data-duration="8" data-width="1080" data-height="1920" data-fps="30">
  <div id="escena" class="clip" data-start="0" data-duration="8" data-track-index="1">
    <div id="camara">
      <div id="cielo" class="layer"></div>
      <div id="lejos" class="layer"></div>
      <div id="cerca" class="layer"></div>
      <div id="calle"></div>
      <div id="luces" class="layer"></div>
      <div id="lluvia" class="layer"></div>

      <div id="t1" class="texto">19:40.</div>
      <div id="t2" class="texto">Salís del laburo.</div>
      <div id="t3" class="texto">Te falta leche, yerba y fideos.</div>
      <div id="t4" class="texto">¿Dónde<br/>conviene?</div>

      <div id="celu">
        <div id="pantalla">
          <div class="hora">19:40</div>
          <div class="noti" id="n1" style="top:120px"><b>Súper del centro</b><span>Leche 1 L · <span class="caro">$2.150</span></span></div>
          <div class="noti" id="n2" style="top:310px"><b>Almacén de la esquina</b><span>Leche 1 L · $1.890</span></div>
          <div class="noti" id="n3" style="top:500px"><b>Híper de la ruta</b><span>Leche 1 L · $1.640 · a 14 cuadras de tu camino</span></div>
          <div id="blanco"></div>
        </div>
      </div>
    </div>
    <div id="vineta" class="layer" data-layout-ignore></div>
    <div id="grano" class="layer" data-layout-ignore></div>
    <div id="flash" class="layer" data-layout-ignore></div>
  </div>
</div>

<script>
  // números "al azar" pero siempre iguales en cada render (semilla fija)
  function semilla(a) { return function () { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
  const azar = semilla(42);

  // armo una fila de edificios con ventanas prendidas
  function skyline(capa, base, alto, escala) {
    let x = -60;
    while (x < 1140) {
      const ancho = (90 + azar() * 140) * escala;
      const h = alto * (0.45 + azar() * 0.55);
      const e = document.createElement("div");
      e.className = "edificio";
      e.style.cssText = `left:${x}px;width:${ancho}px;height:${h}px;bottom:${1920 - base}px`;
      for (let wy = 30; wy < h - 20; wy += 34 * escala) {
        for (let wx = 14; wx < ancho - 14; wx += 26 * escala) {
          if (azar() < 0.38) {
            const v = document.createElement("div");
            v.className = "ventana";
            const tibia = azar() < 0.7;
            v.style.cssText = `left:${wx}px;top:${wy}px;background:${tibia ? "#ffcf7a" : "#9cc4ff"};opacity:${0.35 + azar() * 0.6}`;
            e.appendChild(v);
          }
        }
      }
      capa.appendChild(e);
      x += ancho + 6;
    }
  }
  skyline(document.getElementById("lejos"), 1170, 620, 0.7);
  skyline(document.getElementById("cerca"), 1190, 900, 1);

  // reflejos de las luces en la calle mojada y líneas del medio
  const calle = document.getElementById("calle");
  const coloresReflejo = ["#ff3b30", "#ffcf7a", "#ffffff", "#7cb0ff", "#ff9f0a"];
  for (let i = 0; i < 14; i++) {
    const r = document.createElement("div");
    r.className = "reflejo";
    r.style.cssText = `left:${200 + azar() * 1450}px;background:linear-gradient(180deg,${coloresReflejo[i % 5]},transparent)`;
    calle.appendChild(r);
  }
  for (let i = 0; i < 6; i++) {
    const l = document.createElement("div");
    l.className = "linea";
    l.style.top = `${i * 170}px`;
    calle.appendChild(l);
  }

  // luces desenfocadas
  const luces = document.getElementById("luces");
  const coloresLuz = ["rgba(255,59,48,.75)", "rgba(255,207,122,.7)", "rgba(255,255,255,.65)", "rgba(124,176,255,.6)", "rgba(255,159,10,.7)"];
  for (let i = 0; i < 46; i++) {
    const b = document.createElement("div");
    b.className = "bokeh";
    const d = 30 + azar() * 140;
    b.style.cssText = `width:${d}px;height:${d}px;left:${azar() * 1080}px;top:${880 + azar() * 520}px;
      background:radial-gradient(circle, ${coloresLuz[i % 5]} 0%, transparent 70%);filter:blur(${4 + azar() * 10}px)`;
    b.dataset.v = (azar() * 2 - 1).toFixed(2);
    luces.appendChild(b);
  }

  // lluvia
  const lluvia = document.getElementById("lluvia");
  for (let i = 0; i < 160; i++) {
    const g = document.createElement("div");
    g.className = "gota";
    g.style.cssText = `left:${azar() * 1200 - 60}px;top:${azar() * 1920 - 200}px;height:${40 + azar() * 80}px;opacity:${0.3 + azar() * 0.6}`;
    lluvia.appendChild(g);
  }

  // ---------- línea de tiempo ----------
  const tl = gsap.timeline({ paused: true });

  // cámara: avanza despacio, con un leve pulso de mano
  tl.fromTo("#camara", { scale: 1.08 }, { scale: 1, duration: 6.2, ease: "none" }, 0);
  tl.to("#camara", { keyframes: [{ x: 4, y: -3 }, { x: -3, y: 2 }, { x: 2, y: 4 }, { x: -4, y: -2 }, { x: 0, y: 0 }], duration: 6, ease: "sine.inOut" }, 0);

  // lluvia cayendo en ciclos (se puede adelantar y atrasar sin saltos)
  tl.to(".gota", { y: 420, x: 90, duration: 0.5, ease: "none", repeat: 15 }, 0);
  // luces que pasan como autos
  document.querySelectorAll(".bokeh").forEach((b) => {
    tl.to(b, { x: Number(b.dataset.v) * 260, duration: 8, ease: "none" }, 0);
  });
  // grano que titila
  tl.to("#grano", { backgroundPosition: "300px 120px", duration: 8, ease: "steps(48)" }, 0);

  // textos
  tl.fromTo("#t1", { opacity: 0, y: 30, filter: "blur(12px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: .6, ease: "power3.out" }, .3);
  tl.fromTo("#t2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 1.1);
  tl.fromTo("#t3", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: .5, ease: "power3.out" }, 1.9);
  tl.to(["#t1", "#t2", "#t3"], { opacity: 0, y: -30, filter: "blur(10px)", duration: .4, ease: "power2.in" }, 3.4);
  tl.fromTo("#t4", { opacity: 0, scale: 1.15, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: .55, ease: "power3.out" }, 4.6);

  // el celular sube a cuadro y llegan los precios que no cierran
  tl.fromTo("#celu", { y: 700, rotate: -2 }, { y: 0, rotate: -6, duration: 1.2, ease: "power3.out" }, 1.6);
  tl.fromTo("#n1", { opacity: 0, y: -30, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: "back.out(1.4)" }, 2.6);
  tl.fromTo("#n2", { opacity: 0, y: -30, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: "back.out(1.4)" }, 3.2);
  tl.fromTo("#n3", { opacity: 0, y: -30, scale: .96 }, { opacity: 1, y: 0, scale: 1, duration: .45, ease: "back.out(1.4)" }, 3.8);

  // la cámara entra en la pantalla y todo se va a blanco (ahí arranca DePaso)
  tl.to("#t4", { opacity: 0, duration: .3 }, 6.3);
  tl.to("#camara", { scale: 6, y: -1500, rotate: 6, duration: 1.4, ease: "power3.in" }, 6.4);
  tl.to("#blanco", { opacity: 1, duration: .6, ease: "power2.in" }, 7.0);
  tl.to("#flash", { opacity: 1, duration: .25, ease: "power2.in" }, 7.65);

  window.__timelines = window.__timelines || {};
  window.__timelines["realista"] = tl;
</script>
</body>
</html>

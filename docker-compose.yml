# MySQL local para desarrollo. En producción la base la crea EasyPanel (servicio MySQL).
services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: depaso
      MYSQL_DATABASE: depaso
      MYSQL_USER: depaso
      MYSQL_PASSWORD: depaso
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - depaso_mysql_data:/var/lib/mysql

volumes:
  depaso_mysql_data:
